server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # API gateway: one origin for the browser, one upstream per microservice
    location /api/models/ {
        proxy_pass http://model:8001/;
        proxy_read_timeout 300s;
    }
    location /api/interpreter/ {
        proxy_pass http://interpreter:8002/;
        proxy_read_timeout 300s;
    }
    # the SysML v2 API (Systems Modeling API & Services) where the models are stored
    location /api/sysml-v2/ {
        proxy_pass http://sysml-api:9000/;
        proxy_read_timeout 300s;
    }
    location /api/analysis/ {
        proxy_pass http://analysis:8003/;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri /index.html;
    }
}
