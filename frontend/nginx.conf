server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 20m;

    # API gateway: one origin for the browser, one upstream per microservice
    location /api/models/ {
        proxy_pass http://model:8001/;
        proxy_read_timeout 300s;
    }
    # SysML v2 API (Systems Modeling API and Services) of the model service
    location /api/sysml-v2/ {
        proxy_pass http://model:8001/sysml-v2/;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /api;
        proxy_read_timeout 300s;
    }
    location /api/interpreter/ {
        proxy_pass http://interpreter:8002/;
        proxy_read_timeout 300s;
    }
    location /api/analysis/ {
        proxy_pass http://analysis:8003/;
        proxy_read_timeout 120s;
    }
    location /api/geometry/ {
        proxy_pass http://geometry:8004/;
        proxy_read_timeout 120s;
    }
    location / {
        try_files $uri /index.html;
    }
}
