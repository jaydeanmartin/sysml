name: sysml-platform

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sysml
      POSTGRES_PASSWORD: sysml
      POSTGRES_DB: sysml
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysml -d sysml"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Registry + REST execution of analyses (builtin, formula, external)
  analysis:
    build: ./services/analysis
    environment:
      DATABASE_URL: postgresql://sysml:sysml@postgres:5432/sysml
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8003:8003"

  # Example third-party REST analysis, registered as kind=external (thermalSolver)
  demo-external:
    build: ./services/demo-external
    ports:
      - "8010:8010"

  # SysML v2 interpreter: OpenMBEE OpenSysML behind a REST API
  interpreter:
    build:
      context: .
      dockerfile: services/interpreter/Dockerfile
    environment:
      ANALYSIS_SERVICE_URL: http://analysis:8003
    depends_on:
      - analysis
    ports:
      - "8002:8002"

  # SysML v2 API & Services (OMG pilot implementation): stores the projects, models and
  # their history as commits. Tables live in the sysml_api schema of the platform database.
  sysml-api:
    build:
      context: ./services/sysml-api
      args:
        # 'source' builds the pilot with sbt; or name a prebuilt pilot image to reuse it
        PILOT_IMAGE: ${SYSML_API_PILOT_IMAGE:-source}
    environment:
      SYSML_API_DB_URL: jdbc:postgresql://postgres:5432/sysml
      SYSML_API_DB_USER: sysml
      SYSML_API_DB_PASSWORD: sysml
      SYSML_API_DB_SCHEMA: sysml_api
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "9000:9000"

  # Projects and versioned models (stored in the SysML v2 API server), interpretation and runs
  model:
    build:
      context: .
      dockerfile: services/model/Dockerfile
    environment:
      DATABASE_URL: postgresql://sysml:sysml@postgres:5432/sysml
      SYSML_API_URL: http://sysml-api:9000
      INTERPRETER_SERVICE_URL: http://interpreter:8002
      ANALYSIS_SERVICE_URL: http://analysis:8003
      SEED_DEMO: "true"
    depends_on:
      postgres:
        condition: service_healthy
      interpreter:
        condition: service_started
      sysml-api:
        condition: service_started
    ports:
      - "8001:8001"

  # React UI + API gateway (nginx)
  frontend:
    build: ./frontend
    depends_on:
      - model
      - interpreter
      - analysis
      - sysml-api
    ports:
      - "8080:80"

volumes:
  pgdata:
